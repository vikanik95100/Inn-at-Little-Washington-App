<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Inn at Little Washington Guest App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Jost:wght@300;400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--gr:#00583D;--dg:#00422E;--deep:#002E20;--gold:#B5985B;--lg:#C4AD7C;--dgold:#887244;--parch:#FAF7EE;--bg:#FAF7EE;--cream:#F1EAD6;--ink:#1D1F21;--paper:#FFFEFA;--mut:rgba(29,31,33,.6);--line:rgba(136,114,68,.28);--c:"Jost",system-ui,sans-serif;--f:"Cormorant Garamond",Georgia,serif;--s:1}
html,body{height:100%}
body{font-family:var(--c);background:#E9E2CF;color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
.top{height:62px;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--dg);color:#fff}
.top img{height:34px;display:block}
.top small{font-size:13.5px;color:rgba(255,255,255,.6)}
.sp{flex:1}
.tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:5px 12px;font-weight:500}
.tag.hot{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:600}
.tag[aria-pressed=true]{background:#fff;color:var(--dg)}
.layout{display:grid;grid-template-columns:236px 1fr 340px;height:calc(100% - 62px)}
body[data-notes=off] .layout{grid-template-columns:236px 1fr 0}body[data-notes=off] .notes{display:none}
.rail{padding:22px 16px;overflow:auto;border-right:1px solid rgba(136,114,68,.25);background:#F3EDDB}
.rg{margin-bottom:20px}.rg .eb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dgold);padding:0 10px 8px;font-weight:600}
.ri{display:flex;gap:11px;align-items:center;width:100%;padding:9px 10px;border-radius:10px;font-size:15.5px;font-weight:500;color:#2f4a40}
.ri .n{font-size:12px;color:#a39a88;width:18px;font-variant-numeric:tabular-nums}
.ri:hover{background:rgba(0,88,61,.07)}
.ri[aria-current=true]{background:var(--gr);color:#fff}.ri[aria-current=true] .n{color:rgba(255,255,255,.6)}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(900px 620px at 50% 38%,#FFFBEF,#E6DDC5)}
.pw{width:calc(390px*var(--s));height:calc(844px*var(--s));position:relative;flex:none}
.phone{width:390px;height:844px;border-radius:56px;position:absolute;top:0;left:0;transform-origin:0 0;transform:scale(var(--s));background:#000;box-shadow:0 0 0 10px #0b2a20,0 0 0 11.5px var(--dgold),0 60px 90px -25px rgba(0,46,32,.55)}
.screen{position:absolute;inset:0;border-radius:56px;overflow:hidden;background:var(--bg);color:var(--ink);isolation:isolate}
.screen:after{content:"";position:absolute;inset:0;z-index:90;pointer-events:none;opacity:.07;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .3 0 0 0 0 .1 0 0 0 .9 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.hint{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:14px;color:#6f6858}
.hint button{border:1.5px solid var(--dg);border-radius:99px;padding:5px 14px;font-size:14px;font-weight:500;background:#fff;color:var(--dg)}.hint button:disabled{opacity:.3}
.notes{padding:26px 26px 20px;overflow:auto;border-left:1px solid rgba(136,114,68,.25);background:#F3EDDB}
.notes .eb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dgold);font-weight:600}
.notes h2{font-family:var(--f);font-weight:600;font-size:36px;margin:6px 0 8px;line-height:1}
.notes p.l{font-size:15.5px;line-height:1.5;color:#4b5a54}
.notes ul{margin:14px 0 0 18px;font-size:15px;line-height:1.5;color:#26382f}.notes li{margin-bottom:8px}
.why{margin-top:18px;padding:14px 16px;border-radius:14px;background:#fff;border:1px solid var(--gold);box-shadow:3px 3px 0 var(--lg)}
.why p{font-size:15px;line-height:1.5;margin-top:4px}
.foot{font-size:12.5px;line-height:1.55;color:#8d8576;margin-top:20px}
.sbar{position:absolute;top:0;left:0;right:0;height:56px;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:8px 36px 0 40px;font-weight:600;font-size:16px;pointer-events:none;color:var(--ink);transition:color .3s}
.screen[data-th=dark] .sbar{color:#fff}
.sbar i{display:inline-block;width:17px;height:11px;border-radius:3px;border:1.5px solid currentColor;margin-left:6px;position:relative;opacity:.9}
.sbar i:after{content:"";position:absolute;inset:1.5px;background:currentColor;border-radius:1px;width:60%}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:36px;border-radius:22px;background:#000;z-index:70;transition:width .55s cubic-bezier(.2,.9,.25,1.05),height .55s cubic-bezier(.2,.9,.25,1.05);overflow:hidden;cursor:pointer;color:#fff}
.island .in{opacity:0;transition:opacity .25s;display:flex;align-items:center;gap:12px;padding:13px 18px;white-space:nowrap}
.island.open{width:358px;height:80px;border-radius:40px}.island.open .in{opacity:1;transition-delay:.2s}
.island .ico{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;flex:none}
.island b{font-size:16px;font-weight:600;display:block}.island span.s{font-size:13px;color:rgba(255,255,255,.62)}
.island .t{margin-left:auto;font-family:var(--f);font-size:26px;font-weight:600;color:var(--lg)}
.view{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateY(16px) scale(.985);transition:opacity .4s,transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s .4s;background:var(--bg)}
.view.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.view.dk{background:var(--dg);color:#fff}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:64px 0 132px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 20px}
.rv{opacity:0}.on .rv{animation:up .75s both cubic-bezier(.2,.8,.2,1);animation-delay:calc(var(--d,0)*65ms + 100ms)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--dgold)}
.hd{font-family:var(--f);font-weight:600;line-height:.95;letter-spacing:-.01em}
.hd em,.fr{font-style:italic;font-weight:500}
.gold{background:linear-gradient(100deg,#6b5424 0%,#a98a4a 30%,#80652d 50%,#b99a57 70%,#6b5424 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
.dk .gold,.ph .gold{background-image:linear-gradient(100deg,#8a7040 0%,#d9c48f 30%,#b5985b 50%,#e6d4a3 70%,#8a7040 100%)}
@keyframes sh{to{background-position:-220% 0}}
.h2{font-family:var(--f);font-weight:600;font-size:30px;line-height:1}
.h3{font-weight:600;font-size:17px;line-height:1.15}
.m{font-size:14px;color:var(--mut);line-height:1.4}
.p{font-size:16px;line-height:1.5}
.stk{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:99px;background:var(--gold);color:#fff;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.stk.g{background:var(--gr)}.stk.w{background:rgba(255,255,255,.92);color:var(--dg)}.stk.o{background:transparent;color:var(--dgold);box-shadow:inset 0 0 0 1px var(--gold)}.stk.gl{background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(8px)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;position:relative;overflow:hidden;box-shadow:0 14px 30px -22px rgba(0,46,32,.45)}
.ph{background-size:cover;background-position:center;background-color:#cdbf9f;position:relative}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,30,20,.4) 0%,rgba(0,30,20,0) 34%,rgba(0,30,20,.12) 55%,rgba(0,30,20,.9) 100%)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:56px;border-radius:99px;font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;transition:transform .15s;background:var(--gr);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.btn:active{transform:scale(.97)}
.btn.gd{background:linear-gradient(135deg,#c9b27a,#b5985b 55%,#9c8149);color:#fff}.btn.w{background:#fff;color:var(--dg)}.btn.o{background:transparent;color:var(--dg);box-shadow:inset 0 0 0 1.5px var(--gold)}.btn.sm{height:46px;font-size:13px}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);backdrop-filter:blur(8px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:99px;font-size:14.5px;font-weight:500;box-shadow:inset 0 0 0 1px var(--gold);white-space:nowrap;background:transparent;transition:all .2s;color:var(--dg)}
.chip[aria-pressed=true]{background:var(--gr);color:#fff;box-shadow:none}
.chip:disabled{opacity:.3}
.row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:0 20px;scroll-snap-type:x proximity}.row::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:14px;right:14px;bottom:18px;height:72px;border-radius:36px;z-index:50;display:flex;align-items:center;justify-content:space-around;padding:0 10px;background:rgba(0,46,32,.82);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 18px 36px -10px rgba(0,30,20,.65),inset 0 0 0 1px rgba(196,173,124,.35);transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
.screen[data-tb=off] .tabbar{transform:translateY(130px);opacity:0;pointer-events:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);padding:8px 8px;min-width:56px;transition:color .2s}
.tab[aria-current=true]{color:var(--lg)}
.tab.kf{width:64px;height:64px;min-width:64px;border-radius:50%;background:linear-gradient(135deg,#d3bd86,#b5985b 60%,#8f7640);color:#fff;margin-top:-30px;border:4px solid var(--bg);justify-content:center;box-shadow:0 10px 24px -6px rgba(136,114,68,.8);padding:0}
.bar{display:flex;align-items:center;gap:12px;padding:0 20px 14px}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:#fff;color:var(--dg);box-shadow:0 4px 14px -4px rgba(0,46,32,.4)}
.back.glass{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:22px;padding:16px;position:relative;overflow:hidden;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:1px solid var(--line);background:var(--paper)}
.big{font-family:var(--f);font-weight:600;font-size:46px;letter-spacing:-.02em;line-height:.95}.big small{font-size:.38em;letter-spacing:0;margin-left:3px;color:var(--mut);font-family:var(--c);font-weight:500}
.pulse{width:9px;height:9px;border-radius:50%;background:#3DBE86;position:relative;display:inline-block;flex:none}
.pulse:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid #3DBE86;animation:pl 1.8s infinite}
@keyframes pl{from{transform:scale(.4);opacity:1}to{transform:scale(1.7);opacity:0}}
.mq{overflow:hidden;white-space:nowrap;font-family:var(--f);font-style:italic;font-weight:500;font-size:18px}
.mq div{display:inline-block;animation:mq 30s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.orn{display:flex;align-items:center;gap:12px;color:var(--gold)}.orn:before,.orn:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}.orn:after{background:linear-gradient(90deg,var(--gold),transparent)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:55;border-radius:30px 30px 0 0;padding:10px 20px 32px;transform:translateY(105%);transition:transform .6s cubic-bezier(.2,.85,.25,1);background:var(--paper);box-shadow:0 -24px 50px rgba(0,30,20,.45);color:var(--ink);max-height:92%;overflow-y:auto;scrollbar-width:none;border-top:2px solid var(--gold)}
.sheet.on{transform:none}.sheet .grab{width:48px;height:5px;border-radius:3px;background:var(--gold);opacity:.5;margin:0 auto 16px}
.scrim{position:absolute;inset:0;z-index:54;background:rgba(0,30,20,.5);opacity:0;pointer-events:none;transition:opacity .4s}.scrim.on{opacity:1;pointer-events:auto}
.stepper{display:flex;align-items:center;gap:14px}.stepper button{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--gold);font-size:22px;font-weight:500;display:grid;place-items:center;color:var(--dg)}
.stepper b{font-family:var(--f);font-size:30px;font-weight:600;min-width:26px;text-align:center}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:16px;gap:14px}.kv:last-child{border:0}.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right;font-weight:600}
.msg{max-width:84%;padding:11px 16px;border-radius:20px;font-size:16px;line-height:1.4;animation:up .5s both}
.msg.in{background:#fff;border-bottom-left-radius:6px;align-self:flex-start;box-shadow:0 4px 14px -8px rgba(0,46,32,.5),inset 0 0 0 1px var(--line)}
.msg.out{background:var(--gr);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.msg small{display:block;font-size:11.5px;opacity:.5;margin-top:5px}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.msg .acts button{font-size:13.5px;font-weight:500;padding:7px 14px;border-radius:99px;background:var(--gold);color:#fff}
.typing{display:flex;gap:4px;padding:15px 16px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--gr);opacity:.4;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.2}30%{opacity:.9}}
.toast{position:absolute;left:50%;bottom:116px;transform:translate(-50%,20px);z-index:80;padding:12px 20px;border-radius:99px;font-size:15px;font-weight:500;opacity:0;transition:all .4s cubic-bezier(.2,.8,.2,1);white-space:nowrap;background:var(--dg);color:#fff;box-shadow:0 0 0 1.5px var(--gold)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.kenb{position:absolute;inset:-6%;background-size:cover;background-position:50% 50%;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.16) translate(-2%,-1%)}}
.keybtn{position:relative;width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,#d6c18a,#b5985b 55%,#8d7440);color:#fff;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .2s,background .3s;flex:none;box-shadow:0 10px 24px -8px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.3)}
.keybtn:active{transform:scale(.95)}.keybtn.ok{background:#2f9e6c}
.keybtn svg.rg{position:absolute;inset:-12px;width:136px;height:136px;transform:rotate(-90deg)}
.keybtn .rp{position:absolute;inset:0;border-radius:50%;border:2px solid #fff;opacity:0}.keybtn.ok .rp{animation:rip 1.2s infinite}
@keyframes rip{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
.deck{position:relative;width:350px;height:470px;margin:0 auto}
.dc{position:absolute;inset:0;border-radius:28px;overflow:hidden;box-shadow:0 0 0 1.5px var(--gold),0 24px 40px -22px rgba(0,30,20,.8);background:#fff;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s;cursor:grab}
.dc.drag{transition:none;cursor:grabbing}
.stamp{position:absolute;top:26px;padding:6px 14px;border:2px solid;border-radius:8px;font-family:var(--f);font-weight:700;font-size:28px;letter-spacing:.12em;text-transform:uppercase;opacity:0;z-index:3}
.chk{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--gold);display:grid;place-items:center;flex:none;transition:all .25s;color:transparent;background:#fff}
.chk.on{background:var(--gr);color:#fff;box-shadow:none}
.seg{display:flex;background:var(--cream);border-radius:99px;padding:4px;gap:2px}.seg button{flex:1;text-align:center;padding:9px 6px;border-radius:99px;font-weight:500;font-size:14px;letter-spacing:.04em;transition:all .2s;color:var(--mut)}.seg button[aria-pressed=true]{background:var(--gr);color:#fff}
.toggle{width:52px;height:30px;border-radius:99px;background:rgba(29,31,33,.18);position:relative;transition:background .25s;flex:none}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.toggle[aria-pressed=true]{background:var(--gr)}.toggle[aria-pressed=true]:after{transform:translateX(22px)}
.inv{background:linear-gradient(160deg,#fffdf6,#f4ecd7);border-radius:26px;position:relative;box-shadow:0 22px 40px -20px rgba(0,46,32,.6),0 0 0 1px var(--gold)}
.inv:before{content:"";position:absolute;inset:7px;border-radius:20px;border:1px solid var(--gold);pointer-events:none;opacity:.7}
.seal{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1c8a63,var(--gr) 60%,#003324);color:var(--lg);display:grid;place-items:center;font-family:var(--f);font-style:italic;font-weight:600;font-size:22px;box-shadow:0 6px 12px -4px rgba(0,0,0,.5),inset 0 0 0 2px rgba(196,173,124,.5)}
.ring{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:dr 1.6s .5s forwards ease-out}
@keyframes dr{to{stroke-dashoffset:0}}
.wave{animation:wv 6s linear infinite}
@keyframes wv{to{transform:translateX(-50%)}}

var NOTES={
welcome:["Arrival","Welcome","The Inn's own line, 'Worth a Pilgrimage', over the front of the Inn at dusk.",["A slow drift over the real facade, with the flags out front.","The guest opens the stay from the confirmation email, or the gold seal below.","Type, colours and the gold-and-green palette come from the Inn's own website."],"The Inn sells the feeling of a private home in the country. The app should open like an invitation, not like a booking tool."],
home:["Arrival","Today & key","Sunday arrival on Just One More Night, the Inn's real two-night package. The invitation card holds the room key: hold the gold button.",["Hold to unlock the door (illustrative); the card shows the room, the dates and the package.","Real facts: your room is guaranteed ready by 4:00 pm; afternoon tea runs 2:00 to 5:00 pm in the living room; the Monday sleigh rides start on 30 November.","The pill at the top is a Live Activity for tonight's dinner (tap it)."],"Guests arrive early for tea and wait for the room. The app turns that wait into part of the stay."],
room:["Arrival","Your room","Room 5, a Superior Room in the Main Building: a king bed, a shower/tub and a private balcony. It is named for the food critic Phyllis Richman.",["Real: every room includes a welcome cocktail, afternoon tea, continental breakfast, valet parking, housekeeping three times a day, Wi-Fi and Tesla and universal EV charging.","Do Not Disturb, housekeeping timing and a late check-out request live here; the late check-out is guaranteed on this package.","The room number and assignment are illustrative."],"Housekeeping three times a day is a signature. Letting guests set the rhythm is a service the Inn already delivers, made visible."],
village:["The Inn","Seven buildings","The Main Building, the Parsonage, the Carter House, the Mayor's House, the Gamekeeper's Cottage, the Claiborne House and the Cardinal's Nest.",["Real descriptions and room lists for all 24 accommodations, from Julia Child's Room 1 to the new Parsonage Tower Suite.","Swipe the cards and tap one to see its rooms and amenities.","The Parsonage Belvedere suites are the newest; the Inn is in a 50th-anniversary expansion."],"A guest who has stayed in the Main Building has not yet stayed in the Gamekeeper's Cottage. The app invites the next visit."],
dine:["The Inn","Dining","The Dining Room, Patty O's Café and the Bakery in one place, with the real opening rules.",["The Michelin-starred dining room is closed on Mondays and Tuesdays; Patty O's Café covers those evenings.","Breakfast is 8:00 to 10:30 am for overnight guests; afternoon tea is 2:00 to 5:00 pm; the Bakery is open daily 8:00 am to 5:00 pm; no tipping is expected as a service charge is added.","The dress code is 'anything but a wet bikini'."],"The Inn's restaurants are the product. One screen shows what is open tonight and lets the guest hold a table in two taps."],
wine:["The Inn","Wine & caviar","A cellar of more than 14,000 bottles, plus the caviar experience in partnership with Petrossian.",["Real: Director of Wine Christine Barr; wines of Europe, California, Oregon and Virginia; curated vineyard tours (for example Gray Ghost, Rappahannock Cellars and Veramar).","The sommeliers can create pairings with the menus; the caviar experience pairs the world's finest caviar with wines or Champagnes.","Requests go to the wine team."],"Wine is where a dinner becomes a larger check, and a memory. Giving guests a way to ask in advance helps the sommeliers prepare."],
pool:["The Inn","The pool","The new Grecian-inspired pool, inspired by the painter Sir Lawrence Alma-Tadema.",["Real: heated to 85 degrees all year, open 8:00 am to sunset, for overnight guests only; four cabanas on a first-come basis; an outdoor shower; towels and sunscreen provided.","A poolside menu of snacks, lunch, desserts and non-alcoholic drinks; no lifeguard; children under 14 must be accompanied.","The order button is a concept: the poolside menu is shown by category."],"A pool open in November is a surprise. The app is where guests find out that it is heated and open."],
experiences:["Discover","Signature experiences","A deck of the Inn's real signature experiences. Swipe right to save, left to skip.",["Experiences from the site: the Goose Walk with Farmer Andy, Scotch tasting with Jeff LaBelle, World of Water with Cameron Smith, the Art of Bread & Butter with Christian Capo, floral design, the picnic and more.","Saved ones drop into your stay; a request goes to the concierge.","Prices are not published on the site, so none are shown."],"These experiences are what make a second night worth having. They need discovery, and the app does that."],
around:["Discover","Around the village","Little Washington and the Blue Ridge, from the Inn's own activity lists.",["The village (galleries and the Tavern Shops), nearby vineyards, hiking in Shenandoah National Park, and farms and orchards.","Each place is a real suggestion from the site, with a one-tap save to the plan.","The lists are written to be edited by the concierge."],"Guests ask the concierge the same questions every day. The app answers while the concierge sells something better."],
offers:["Discover","Offers","The Inn's real offers: Just One More Night, Weeknights Just Became More Fun, Far From the Madding Crowd, Plan Now Luxuriate Later and the Monday sleigh rides.",["Real terms: a $200 food and beverage credit Monday to Wednesday; the all-inclusive Far From the Madding Crowd package Wednesday to Sunday; 10% off when you plan ahead.","Tapping an offer opens the terms and a reserve button.","The guest on Just One More Night sees theirs first."],"A guest in the app is the best audience for the next booking. Offers shown at the right moment bring them back."],
chat:["More","Concierge chat","An answer bot built from the Inn's FAQ, with the reservations team behind it.",["Try 'dress code', 'parking', 'check-in', 'check-out', 'breakfast', 'tea', 'tipping', 'pool' or 'dining room'.","Answers use the real hours and rules.","Anything else goes to reservations at 540.675.3800."],"The same dozen questions arrive by phone every day. The app answers them in seconds and leaves the team free for the guests."],
checkout:["More","Check-out","The folio, check-out at noon and a thank-you.",["Real: check-out is at 12:00 noon; the package includes a guaranteed late check-out on Tuesday and a departure gift.","Room amounts are illustrative; the Inn does not publish rates.","The next stay is one tap away."],"A calm departure is the last memory. It also hands the guest a reason to come back."]};
